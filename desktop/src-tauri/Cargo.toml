[package]
name = "songv-desktop"
version = "1.0.0"
description = "SongV para computador"
authors = ["Victor K"]
license = "MIT"
edition = "2021"

[lib]
name = "songv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
mdns-sd = "0.13"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
if-addrs = "0.13"
hostname = "0.4"
lofty = "0.25"
dirs = "6"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
