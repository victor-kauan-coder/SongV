<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SongV</title>
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="app.js"></script>
</head>
<body data-estilo="atual" data-fonte="pc" data-faixa="nao" data-tocando="nao" data-carregando="nao" data-receptor="nao" data-celular="nao" data-palco="nao" data-tela-cheia="nao" data-direita="sim">

  <div class="janela">

    <!-- ============================================================ topo -->
    <header class="topo" data-tauri-drag-region>
      <div class="topo-esq" data-tauri-drag-region>
        <button type="button" class="tecla-icone menu-botao" id="menu-botao" popovertarget="menu" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
        </button>
        <button type="button" class="redondo pequeno" id="voltar" aria-label="Voltar" title="Voltar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
        </button>
        <button type="button" class="redondo pequeno" id="avancar" aria-label="Avançar" title="Avançar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg>
        </button>
      </div>

      <div class="topo-centro" data-tauri-drag-region>
        <button type="button" class="redondo grande" data-ir="inicio" aria-label="Início" title="Início">
          <svg class="contorno" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 3 10.4V21h7v-6h4v6h7V10.4zM19 19h-3v-6H8v6H5v-7.6l7-5.6 7 5.6z"/></svg>
          <svg class="cheio" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10.2V21h7v-6h4v6h7V10.2z"/></svg>
        </button>
        <label class="busca-topo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.23-1.41 1.42-4.24-4.24A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          <input type="search" id="busca" placeholder="O que você quer ouvir?" autocomplete="off" spellcheck="false" aria-label="Buscar faixas, álbuns e artistas">
          <span class="separador" aria-hidden="true"></span>
          <button type="button" class="navegar" data-ir="navegar" aria-label="Navegar por tudo" title="Navegar por tudo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4h-1v12H5V8H4zm2 4v10h12V8zm-0-2h12V6H6zm3 4h6v2H9z"/></svg>
          </button>
        </label>
      </div>

      <div class="topo-dir" data-tauri-drag-region>
        <button type="button" class="pilula-celular" id="botao-celular" aria-label="Celular">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 3v13h8V5zm3 14.5v1h2v-1z"/></svg>
          <span id="nome-celular-topo">Conectar celular</span>
          <span class="led" aria-hidden="true"></span>
        </button>
        <div class="controles-janela">
          <button type="button" id="j-min" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"/></svg></button>
          <button type="button" id="j-max" aria-label="Maximizar" title="Maximizar">
            <svg class="i-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
            <svg class="i-rest" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg>
          </button>
          <button type="button" id="j-fechar" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>
        </div>
      </div>
    </header>

    <!-- ============================================================ biblioteca -->
    <aside class="biblioteca cartao-painel superficie" aria-label="Sua biblioteca">
      <div class="bib-cabeca">
        <h2>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.7 1.9-.7 5.9 16.9-1.9.7z"/></svg>
          <span>Sua biblioteca</span>
        </h2>
      </div>
      <div class="bib-chips" id="bib-fontes" role="group" aria-label="De onde"></div>
      <div class="bib-chips" id="bib-tipos" role="group" aria-label="Mostrar"></div>
      <div class="bib-ferramentas">
        <label class="bib-busca" id="bib-busca">
          <button type="button" class="icone-busca" aria-label="Buscar na biblioteca">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.23-1.41 1.42-4.24-4.24A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          </button>
          <input type="search" id="bib-filtro" placeholder="Buscar na biblioteca" autocomplete="off">
        </label>
        <button type="button" class="bib-ordem" id="bib-ordem">
          <span id="bib-ordem-rotulo">Recentes</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h14v2H3zm0 5h10v2H3zm0 5h6v2H3zm15-6h2v8.2l1.6-1.6L23 18l-4 4-4-4 1.4-1.4 1.6 1.6z"/></svg>
        </button>
      </div>
      <div class="bib-lista" id="bib-lista" role="list"></div>
    </aside>

    <!-- ============================================================ principal -->
    <main class="principal cartao-painel superficie">
      <div class="barra-fixa" id="barra-fixa" aria-hidden="true">
        <button type="button" class="play-grande pequeno" id="fixa-play" tabindex="-1" aria-label="Tocar">
          <svg class="i-tocar" viewBox="0 0 24 24"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.53.85l10.1-6.4a1 1 0 0 0 0-1.7l-10.1-6.4A1 1 0 0 0 8.5 5.6z"/></svg>
          <svg class="i-pausar" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>
        </button>
        <span id="fixa-titulo"></span>
      </div>
      <div class="rolagem" id="conteudo" tabindex="-1"></div>

      <section class="palco" id="palco" aria-label="Letra">
        <div class="palco-cabeca">
          <div class="capa palco-capa" id="palco-capa"></div>
          <div class="palco-info">
            <b id="palco-titulo">—</b>
            <span id="palco-artista"></span>
          </div>
          <button type="button" class="redondo pequeno" id="fechar-palco" aria-label="Fechar a letra" title="Fechar a letra">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 5.6 17 4.2l-5 5-5-5-1.4 1.4 5 5-5 5L7 17l5-5 5 5 1.4-1.4-5-5z"/></svg>
          </button>
        </div>
        <div class="letra" id="letra" aria-label="Letra"></div>
      </section>
    </main>

    <!-- ============================================================ tocando agora -->
    <aside class="direita cartao-painel superficie" aria-label="Tocando agora">
      <div class="dir-cabeca">
        <b id="dir-origem">Tocando agora</b>
        <button type="button" class="redondo pequeno" id="fechar-direita" aria-label="Fechar o painel" title="Fechar o painel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 5.6 17 4.2l-5 5-5-5-1.4 1.4 5 5-5 5L7 17l5-5 5 5 1.4-1.4-5-5z"/></svg>
        </button>
      </div>
      <div class="dir-rolagem">
        <div class="capa dir-capa" id="dir-capa"></div>
        <div class="dir-titulos">
          <b id="dir-titulo">Nada tocando</b>
          <span id="dir-artista">Escolha uma música na biblioteca</span>
        </div>
        <div class="dir-receptor" id="dir-receptor">
          <span class="led" aria-hidden="true"></span>
          <span id="dir-receptor-texto"></span>
        </div>
        <section class="dir-fila" aria-labelledby="dir-fila-titulo">
          <h3 id="dir-fila-titulo">A seguir</h3>
          <div id="dir-fila" role="list"></div>
        </section>
      </div>
    </aside>

    <!-- ============================================================ barra do player -->
    <footer class="barra" aria-label="Controles">
      <div class="agora">
        <button type="button" class="agora-capa" id="abrir-palco" aria-label="Abrir a letra" title="Letra">
          <div class="capa" id="painel-capa"></div>
        </button>
        <div class="agora-texto">
          <button type="button" class="link" id="painel-titulo">Nada tocando</button>
          <span id="painel-artista"></span>
          <span class="origem"><span class="led" aria-hidden="true"></span><span id="painel-origem"></span></span>
        </div>
      </div>

      <div class="centro">
        <div class="transporte">
          <button type="button" class="tecla-icone modo" id="aleatorio" aria-label="Ordem aleatória" aria-pressed="false" title="Aleatório">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4.5 20.5 8 17 11.5V9h-1.6a3 3 0 0 0-2.5 1.34L8.8 16.4A5 5 0 0 1 4.6 18.6H3v-2h1.6a3 3 0 0 0 2.5-1.34l4.1-6.06A5 5 0 0 1 15.4 7H17zM3 7h1.6a5 5 0 0 1 3.7 1.66L7 10.2A3 3 0 0 0 4.6 9H3zm14 7.5 3.5 3.5-3.5 3.5V19h-1.6a5 5 0 0 1-3.7-1.66l1.3-1.54A3 3 0 0 0 15.4 17H17z"/></svg>
          </button>
          <button type="button" class="tecla-icone" id="anterior" aria-label="Faixa anterior" title="Anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button type="button" class="play-barra" id="tocar" aria-label="Tocar" title="Tocar">
            <svg class="i-tocar" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.53.85l10.1-6.4a1 1 0 0 0 0-1.7l-10.1-6.4A1 1 0 0 0 8.5 5.6z"/></svg>
            <svg class="i-pausar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>
          </button>
          <button type="button" class="tecla-icone" id="proxima" aria-label="Próxima faixa" title="Próxima">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button type="button" class="tecla-icone modo" id="repetir" aria-label="Repetir" aria-pressed="false" title="Repetir">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10V4.5l3.5 3.5L17 11.5V9H7v4H5V9a2 2 0 0 1 2-2zm10 10H7v2.5L3.5 16 7 12.5V15h10v-4h2v4a2 2 0 0 1-2 2z"/></svg>
            <span class="um" aria-hidden="true">1</span>
          </button>
        </div>
        <div class="tempo">
          <span class="numeros" id="agora">0:00</span>
          <input type="range" id="barra" min="0" max="1000" value="0" step="1" aria-label="Posição na faixa">
          <span class="numeros" id="total">0:00</span>
        </div>
      </div>

      <div class="extras">
        <button type="button" class="tecla-icone modo" id="botao-letra" aria-label="Letra" aria-pressed="false" title="Letra">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 3.6a5 5 0 0 1 7 7L19 12a5 5 0 0 1-6.4-.6 5 5 0 0 1-.6-6.4zm1.4 1.4a3 3 0 0 0 4.2 4.2zM11 8l5 5-7.8 7.8a2 2 0 0 1-2.8 0l-.6-.6-1.4 1.4-1.4-1.4 1.4-1.4-.6-.6a2 2 0 0 1 0-2.8z"/></svg>
        </button>
        <button type="button" class="tecla-icone modo" id="botao-fila" aria-label="Tocando agora e fila" aria-pressed="true" title="Tocando agora">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h13v2H3zm0 6h13v2H3zm0 6h8v2H3zm15-4h2v4.2a2.5 2.5 0 1 1-2-2.45z"/></svg>
        </button>
        <button type="button" class="tecla-icone modo" id="botao-dispositivo" aria-label="Conectar a um dispositivo" aria-pressed="false" title="Dispositivos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a1 1 0 0 1 1 1v3h-2V6H5v12h6v2H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm10 6h7a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm1 2v7h5v-7zm2.5 1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
        </button>
        <div class="volume">
          <button type="button" class="tecla-icone" id="mudo" aria-label="Sem som" title="Sem som">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          </button>
          <input type="range" id="volume" min="0" max="100" value="100" step="1" aria-label="Volume">
        </div>
        <button type="button" class="tecla-icone" id="tela-cheia" aria-label="Tela cheia" title="Tela cheia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Menu "•••" -->
  <div class="popover menu superficie" id="menu" popover="auto" aria-label="Menu">
    <button type="button" class="item-menu" data-menu="config">Configurações</button>
    <button type="button" class="item-menu" data-menu="pasta">Escolher a pasta de músicas…</button>
    <button type="button" class="item-menu" data-menu="atualizar">Atualizar a biblioteca</button>
    <button type="button" class="item-menu" data-menu="celular">Conectar um celular</button>
    <hr>
    <button type="button" class="item-menu" data-menu="sobre">Sobre o SongV</button>
  </div>

  <!-- Conectar a um dispositivo -->
  <div class="popover superficie" id="dispositivos" popover="auto" aria-label="Dispositivos"></div>

  <dialog id="pareamento" aria-labelledby="par-titulo">
    <h2 id="par-titulo">Parear com o celular</h2>
    <p id="par-texto">Confira se o mesmo código aparece no celular.</p>
    <p class="codigo numeros" id="par-codigo" aria-live="polite"></p>
    <div class="dialogo-acoes">
      <button type="button" class="tecla" id="par-cancelar">Cancelar</button>
      <button type="button" class="tecla cheia" id="par-confirmar">Os códigos são iguais</button>
    </div>
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  <audio id="audio" preload="auto"></audio>
</body>
</html>
